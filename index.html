<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Tracer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>

    <div id="image-container">
        <img id="trace-image" alt="Uploaded drawing reference" style="display: none;">
    </div>

    <div id="ui-panel">
        <h1>AR Tracer</h1>
        
        <div class="control-group">
            <label for="image-upload">Upload Image:</label>
            <input type="file" id="image-upload" accept="image/*">
        </div>

        <div class="control-group">
            <input type="checkbox" id="remove-bg-toggle">
            <label for="remove-bg-toggle">Remove White Background</label>
        </div>

        <div class="control-group">
            <label for="opacity-slider">Transparency:</label>
            <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="0.5">
        </div>

        <div class="control-group">
            <label for="scale-slider">Scale:</label>
            <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1">
        </div>

        <button id="hide-ui-btn">Hide UI</button>
    </div>

    <button id="show-ui-btn" style="display: none;">⚙️ Show UI</button>

    <script src="script.js" defer></script>
</body>
</html>
