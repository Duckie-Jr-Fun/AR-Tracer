<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Tracer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>

    <div id="image-container">
        <img id="trace-image" alt="Trace reference" style="display: none;">
    </div>

    <div id="ui-panel">
        
        <div class="btn-row">
            <label for="image-upload" class="custom-btn">Upload</label>
            <input type="file" id="image-upload" accept="image/*">
            
            <button id="torch-btn" class="custom-btn">Light</button>
        </div>

        <div class="control-group">
            <label class="toggle-switch">
                <input type="checkbox" id="remove-bg-toggle">
                <span class="toggle-slider"></span>
            </label>
            <span class="label-text">Remove White BG</span>
        </div>

        <div class="control-group">
            <span class="label-text">Opacity</span>
            <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="0.5">
        </div>

        <div class="control-group">
            <span class="label-text">Scale</span>
            <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1">
        </div>

        <button id="hide-ui-btn" class="custom-btn hide-btn">Hide</button>
    </div>

    <button id="show-ui-btn" style="display: none;">Show</button>

    <script src="main.js"></script>
</body>
</html>
